# ============================================
# AquaNexus Backend — Application Properties
# Environment-driven configuration for local & Render cloud deployment
# ============================================

# Server Port (Render dynamically assigns PORT)
server.port=${PORT:8080}

# -------------------------------------------------------------
# Database Configuration
# Defaults to MySQL if available, or H2 in-memory if unconfigured
# -------------------------------------------------------------
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/aquanexus?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Deepak2005}
spring.datasource.driver-class-name=${DB_DRIVER:com.mysql.cj.jdbc.Driver}
spring.jpa.properties.hibernate.dialect=${DB_DIALECT:org.hibernate.dialect.MySQLDialect}

# JPA / Hibernate SQL Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.defer-datasource-initialization=true

# H2 Console (available when running in H2 profile)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT Security
app.jwt.secret=${JWT_SECRET:AquaNexusWaterIntelligenceSecretKey2024VeryLongAndSecureKeyForHS256Algorithm}
app.jwt.expiration-ms=86400000

# Google OAuth
app.google.client-id=${GOOGLE_CLIENT_ID:125421011304-r2aim0eo5sr6q8ioliegtnh9340jvi98.apps.googleusercontent.com}

# CORS (Allows local development, Render URLs, and any custom domain)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5500,http://127.0.0.1:5500,http://localhost:8000,https://*.onrender.com,http://localhost:8080}

# Python ML Microservice URL
app.ml-service.base-url=${ML_SERVICE_URL:http://localhost:5000}

# NVIDIA NIM AI Integration
app.ai.nvidia.api-key=${NVIDIA_API_KEY:}
app.ai.nvidia.base-url=${NVIDIA_BASE_URL:https://integrate.api.nvidia.com/v1}
app.ai.nvidia.model=${NVIDIA_MODEL:openai/gpt-oss-20b}

