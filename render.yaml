services:
  # 1. AquaNexus Spring Boot Backend Web Service
  - type: web
    name: aquanexus-backend
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    envVars:
      - key: PORT
        value: 8080
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: "http://localhost:3000,http://localhost:8000,https://*.onrender.com"

  # 2. AquaNexus Static Web Frontend
  - type: web
    name: aquanexus-frontend
    env: static
    buildCommand: ""
    staticPublishPath: .
    plan: free
    region: oregon
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
