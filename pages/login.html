<!-- Login Page Fragment -->
<div class="w-full max-w-md mx-auto p-4 page-enter">
  <div class="glass-panel rounded-2xl p-8 border border-white/10 shadow-2xl relative overflow-hidden login-card">
    
    <!-- Decorative background glow inside card -->
    <div class="absolute -top-24 -right-24 w-48 h-48 bg-primary/20 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute -bottom-24 -left-24 w-48 h-48 bg-secondary/20 rounded-full blur-3xl pointer-events-none"></div>

    <div class="text-center mb-8 relative z-10">
      <div class="w-16 h-16 mx-auto bg-gradient-to-br from-primary to-secondary rounded-2xl flex items-center justify-center shadow-lg shadow-primary/20 mb-4 liquid-wave">
        <span class="material-symbols-outlined text-white text-3xl">water_drop</span>
      </div>
      <h1 class="text-3xl font-display font-bold text-white tracking-tight mb-2">AquaCommand</h1>
      <p class="text-on-surface-variant text-sm">Enterprise Water Intelligence</p>
    </div>

    <!-- Alert Message Container -->
    <div id="login-alert" class="hidden mb-4 p-3 rounded-xl text-sm border relative z-10"></div>

    <form id="login-form" class="space-y-5 relative z-10">
      <div class="space-y-4">
        <!-- Email Input -->
        <div class="relative group">
          <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant transition-colors group-focus-within:text-primary">mail</span>
          <input type="email" id="login-email" placeholder="Official Email Address" class="w-full bg-surface/50 border border-white/10 rounded-xl pl-12 pr-4 py-3 text-white focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary input-glass transition-all placeholder:text-on-surface-variant/50" required>
        </div>

        <!-- Password Input -->
        <div class="relative group">
          <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant transition-colors group-focus-within:text-primary">lock</span>
          <input type="password" id="login-password" placeholder="Password" class="w-full bg-surface/50 border border-white/10 rounded-xl pl-12 pr-12 py-3 text-white focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary input-glass transition-all placeholder:text-on-surface-variant/50" required>
          <button type="button" onclick="Auth.togglePasswordVisibility('login-password', 'login-pwd-icon')" class="absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-white transition-colors focus:outline-none">
            <span id="login-pwd-icon" class="material-symbols-outlined text-sm">visibility</span>
          </button>
        </div>
      </div>

      <div class="flex items-center justify-between text-sm">
        <label class="flex items-center gap-2 cursor-pointer group">
          <input type="checkbox" class="rounded border-white/20 bg-surface/50 text-primary focus:ring-primary focus:ring-offset-background">
          <span class="text-on-surface-variant group-hover:text-white transition-colors">Remember me</span>
        </label>
        <a href="#" class="text-primary hover:text-primary-variant transition-colors">Forgot Password?</a>
      </div>

      <button type="submit" class="w-full bg-primary hover:bg-primary-variant text-white font-bold py-3 px-4 rounded-xl shadow-[0_0_20px_rgba(16,185,129,0.3)] hover:shadow-[0_0_30px_rgba(16,185,129,0.5)] transition-all flex items-center justify-center gap-2 btn-pulse">
        <span>Sign In</span>
        <span class="material-symbols-outlined">login</span>
      </button>

      <!-- Divider -->
      <div class="flex items-center my-4">
        <div class="flex-grow border-t border-white/10"></div>
        <span class="mx-3 text-xs text-on-surface-variant uppercase tracking-wider">OR</span>
        <div class="flex-grow border-t border-white/10"></div>
      </div>

      <!-- Google Sign In Placeholder -->
      <button type="button" onclick="Auth.initGoogleSignIn()" class="w-full bg-surface/50 hover:bg-surface border border-white/10 hover:border-white/20 text-white font-medium py-3 px-4 rounded-xl transition-all flex items-center justify-center gap-3">
        <svg class="w-5 h-5" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
        </svg>
        <span>Sign in with Google</span>
      </button>
    </form>

    <div class="mt-6 text-center relative z-10">
      <p class="text-sm text-on-surface-variant">
        Don't have an account? 
        <a href="#/register" data-route="/register" class="text-primary hover:text-primary-variant font-medium transition-colors">Create one</a>
      </p>
    </div>

    <div class="mt-8 text-center text-xs text-on-surface-variant relative z-10">
      <p>Protected by AquaGuard AI Security</p>
      <p class="mt-1 opacity-50">v4.2.0-enterprise</p>
    </div>
  </div>
</div>

<script>
  // Hide shell UI elements
  document.getElementById('app-sidebar').classList.add('hidden');
  document.getElementById('app-sidebar').classList.remove('md:flex');
  document.getElementById('app-header').classList.add('hidden');
  document.getElementById('app-bottom-nav').classList.add('hidden');
  
  // Set page title for when we transition out
  document.getElementById('page-title').innerText = "Enterprise Overview";

  // Handle Login
  document.getElementById('login-form').addEventListener('submit', async function(e) {
    e.preventDefault();
    const email = document.getElementById('login-email').value;
    const password = document.getElementById('login-password').value;
    const alertBox = document.getElementById('login-alert');
    const btn = this.querySelector('button[type="submit"]');

    btn.disabled = true;
    btn.innerHTML = '<span class="material-symbols-outlined animate-spin">sync</span> Signing in...';

    const result = await window.Auth.login(email, password);

    btn.disabled = false;
    btn.innerHTML = '<span>Sign In</span><span class="material-symbols-outlined">login</span>';

    if (result.success) {
      alertBox.className = 'mb-4 p-3 rounded-xl text-sm border relative z-10 border-success/30 bg-success/10 text-success';
      alertBox.innerText = 'Login successful! Redirecting...';
      alertBox.classList.remove('hidden');
      setTimeout(() => {
        window.Router.navigate('/dashboard');
      }, 500);
    } else {
      alertBox.className = 'mb-4 p-3 rounded-xl text-sm border relative z-10 border-error/30 bg-error/10 text-error';
      alertBox.innerText = result.message;
      alertBox.classList.remove('hidden');
    }
  });

  // Check if there's a registration success message in sessionStorage
  const successMsg = sessionStorage.getItem('registerSuccess');
  if (successMsg) {
    const alertBox = document.getElementById('login-alert');
    alertBox.className = 'mb-4 p-3 rounded-xl text-sm border relative z-10 border-success/30 bg-success/10 text-success';
    alertBox.innerText = successMsg;
    alertBox.classList.remove('hidden');
    sessionStorage.removeItem('registerSuccess');
  }
</script>
