<!-- Register Page Fragment -->
<div class="w-full max-w-md mx-auto p-4 page-enter">
  <div class="glass-panel rounded-2xl p-8 border border-white/10 shadow-2xl relative overflow-hidden login-card">
    
    <!-- Decorative background glow inside card -->
    <div class="absolute -top-24 -right-24 w-48 h-48 bg-primary/20 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute -bottom-24 -left-24 w-48 h-48 bg-secondary/20 rounded-full blur-3xl pointer-events-none"></div>

    <div class="text-center mb-6 relative z-10">
      <div class="w-12 h-12 mx-auto bg-gradient-to-br from-primary to-secondary rounded-xl flex items-center justify-center shadow-lg shadow-primary/20 mb-3 liquid-wave">
        <span class="material-symbols-outlined text-white text-2xl">person_add</span>
      </div>
      <h1 class="text-2xl font-display font-bold text-white tracking-tight mb-1">Create Account</h1>
      <p class="text-on-surface-variant text-sm">Join AquaCommand Enterprise</p>
    </div>

    <!-- Alert Message Container -->
    <div id="register-alert" class="hidden mb-4 p-3 rounded-xl text-sm border relative z-10"></div>

    <form id="register-form" class="space-y-4 relative z-10">
      
      <!-- Full Name -->
      <div class="relative group">
        <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant transition-colors group-focus-within:text-primary text-sm">badge</span>
        <input type="text" id="reg-fullname" placeholder="Full Name" class="w-full bg-surface/50 border border-white/10 rounded-xl pl-11 pr-4 py-2.5 text-sm text-white focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary input-glass transition-all placeholder:text-on-surface-variant/50" required>
      </div>

      <!-- Username -->
      <div class="relative group">
        <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant transition-colors group-focus-within:text-primary text-sm">person</span>
        <input type="text" id="reg-username" placeholder="Username" class="w-full bg-surface/50 border border-white/10 rounded-xl pl-11 pr-4 py-2.5 text-sm text-white focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary input-glass transition-all placeholder:text-on-surface-variant/50" required>
      </div>

      <!-- Email -->
      <div class="relative group">
        <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant transition-colors group-focus-within:text-primary text-sm">mail</span>
        <input type="email" id="reg-email" placeholder="Official Email Address" class="w-full bg-surface/50 border border-white/10 rounded-xl pl-11 pr-4 py-2.5 text-sm text-white focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary input-glass transition-all placeholder:text-on-surface-variant/50" required>
      </div>

      <!-- Password -->
      <div class="relative group">
        <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant transition-colors group-focus-within:text-primary text-sm">lock</span>
        <input type="password" id="reg-password" placeholder="Password (8+ chars, 1 upper, 1 num)" class="w-full bg-surface/50 border border-white/10 rounded-xl pl-11 pr-11 py-2.5 text-sm text-white focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary input-glass transition-all placeholder:text-on-surface-variant/50" required>
        <button type="button" onclick="Auth.togglePasswordVisibility('reg-password', 'reg-pwd-icon')" class="absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-white transition-colors focus:outline-none">
          <span id="reg-pwd-icon" class="material-symbols-outlined text-sm">visibility</span>
        </button>
      </div>

      <!-- Confirm Password -->
      <div class="relative group">
        <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant transition-colors group-focus-within:text-primary text-sm">lock_reset</span>
        <input type="password" id="reg-confirm-password" placeholder="Confirm Password" class="w-full bg-surface/50 border border-white/10 rounded-xl pl-11 pr-11 py-2.5 text-sm text-white focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary input-glass transition-all placeholder:text-on-surface-variant/50" required>
        <button type="button" onclick="Auth.togglePasswordVisibility('reg-confirm-password', 'reg-conf-pwd-icon')" class="absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-white transition-colors focus:outline-none">
          <span id="reg-conf-pwd-icon" class="material-symbols-outlined text-sm">visibility</span>
        </button>
      </div>

      <button type="submit" class="w-full bg-primary hover:bg-primary-variant text-white font-bold py-3 px-4 mt-2 rounded-xl shadow-[0_0_20px_rgba(16,185,129,0.3)] hover:shadow-[0_0_30px_rgba(16,185,129,0.5)] transition-all flex items-center justify-center gap-2 btn-pulse">
        <span>Create Account</span>
        <span class="material-symbols-outlined text-sm">how_to_reg</span>
      </button>

    </form>

    <div class="mt-6 text-center relative z-10">
      <p class="text-sm text-on-surface-variant">
        Already have an account? 
        <a href="#/login" data-route="/login" class="text-primary hover:text-primary-variant font-medium transition-colors">Sign In</a>
      </p>
    </div>

  </div>
</div>

<script>
  // Hide shell UI elements
  document.getElementById('app-sidebar').classList.add('hidden');
  document.getElementById('app-sidebar').classList.remove('md:flex');
  document.getElementById('app-header').classList.add('hidden');
  document.getElementById('app-bottom-nav').classList.add('hidden');
  
  // Set page title for when we transition out
  document.getElementById('page-title').innerText = "Enterprise Overview";

  // Handle Registration
  document.getElementById('register-form').addEventListener('submit', async function(e) {
    e.preventDefault();
    
    const userData = {
      fullName: document.getElementById('reg-fullname').value,
      username: document.getElementById('reg-username').value,
      email: document.getElementById('reg-email').value,
      password: document.getElementById('reg-password').value,
      confirmPassword: document.getElementById('reg-confirm-password').value
    };

    const alertBox = document.getElementById('register-alert');
    const btn = this.querySelector('button[type="submit"]');

    btn.disabled = true;
    btn.innerHTML = '<span class="material-symbols-outlined animate-spin">sync</span> Creating...';

    const result = await window.Auth.register(userData);

    btn.disabled = false;
    btn.innerHTML = '<span>Create Account</span><span class="material-symbols-outlined text-sm">how_to_reg</span>';

    if (result.success) {
      alertBox.className = 'mb-4 p-3 rounded-xl text-sm border relative z-10 border-success/30 bg-success/10 text-success';
      alertBox.innerText = result.message;
      alertBox.classList.remove('hidden');
      sessionStorage.setItem('registerSuccess', result.message);
      setTimeout(() => {
        window.Router.navigate('/login');
      }, 800);
    } else {
      alertBox.className = 'mb-4 p-3 rounded-xl text-sm border relative z-10 border-error/30 bg-error/10 text-error';
      alertBox.innerText = result.message;
      alertBox.classList.remove('hidden');
    }
  });
</script>
